services:
  db:
    image: postgres:14
    container_name: cynaris_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cynaris_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: cynaris_backend
    environment:
      DB_NAME: ${POSTGRES_DB:-cynaris_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_HOST: db
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    container_name: cynaris_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
